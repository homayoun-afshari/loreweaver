<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="1844" viewBox="0 0 1980 1844" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>01 · Product Discovery, Legacy CMS &amp; Scaffolding</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1980" height="1844" fill="url(#bg)"/>

  <text x="990" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">01 · Product Discovery, Legacy CMS &amp; Scaffolding</text>
  <line x1="890" y1="74" x2="1090" y2="74" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Legacy CMS -->
  <rect x="40" y="130" width="260" height="336" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M40,180 L40,144 Q40,130 54,130 L286,130 Q300,130 300,144 L300,180 Z" fill="#7c3aed"/>
  <text x="170" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Legacy CMS</text>
  <text x="170" y="206" text-anchor="middle" font-size="13.5" fill="#475569">PHP 8.4, Slim 4, Docker</text>
  <line x1="60" y1="220" x2="280" y2="220" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="246" font-size="13" fill="#1e293b">- GET /health</text>
  <text x="60" y="266" font-size="13" fill="#1e293b">- GET /v1/characters/{id}/state</text>
  <text x="60" y="286" font-size="13" fill="#1e293b">- GET /v1/characters?world_id&amp;page</text>
  <text x="60" y="306" font-size="13" fill="#1e293b">- X-API-Key, 30 requests/min</text>
  <text x="60" y="326" font-size="13" fill="#1e293b">- Random delays and 503s</text>
  <text x="60" y="346" font-size="13" fill="#1e293b">- OpenAPI contract</text>
  <path d="M40,404 L300,404 L300,452 Q300,466 286,466 L54,466 Q40,466 40,452 Z" fill="#f1f5f9"/>
  <text x="83.33333333333334" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">DEV</text>
  <text x="83.33333333333334" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Docker</text>
  <text x="170" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">PREV</text>
  <text x="170" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Google Cloud</text>
  <text x="256.66666666666663" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">PROD</text>
  <text x="256.66666666666663" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Google Cloud</text>
  <rect x="52" y="118" width="62" height="24" rx="12" fill="#52606d" stroke="#ffffff" stroke-width="2"/>
  <text x="83" y="134.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Docker</text>

  <!-- Anti-Corruption -->
  <rect x="450" y="130" width="260" height="336" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M450,180 L450,144 Q450,130 464,130 L696,130 Q710,130 710,144 L710,180 Z" fill="#0d9488"/>
  <text x="580" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Anti-Corruption</text>
  <text x="580" y="206" text-anchor="middle" font-size="13.5" fill="#475569">TypeScript, Zod, fetch</text>
  <line x1="470" y1="220" x2="690" y2="220" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="470" y="246" font-size="13" fill="#1e293b">- getCharacterState(id)</text>
  <text x="470" y="266" font-size="13" fill="#1e293b">- Maps legacy fields to domain</text>
  <text x="470" y="286" font-size="13" fill="#1e293b">- 2 s timeout, 3 retries, backoff</text>
  <text x="470" y="306" font-size="13" fill="#1e293b">- Circuit breaker</text>
  <text x="470" y="326" font-size="13" fill="#1e293b">- Typed errors, never exceptions</text>
  <path d="M450,404 L710,404 L710,452 Q710,466 696,466 L464,466 Q450,466 450,452 Z" fill="#f1f5f9"/>
  <text x="493.3333333333333" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">DEV</text>
  <text x="493.3333333333333" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Node</text>
  <text x="580" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">PREV</text>
  <text x="580" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Vercel</text>
  <text x="666.6666666666666" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">PROD</text>
  <text x="666.6666666666666" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Vercel</text>
  <rect x="462" y="118" width="49" height="24" rx="12" fill="#27272a" stroke="#ffffff" stroke-width="2"/>
  <text x="486.5" y="134.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Core</text>

  <!-- App -->
  <rect x="860" y="130" width="260" height="336" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M860,180 L860,144 Q860,130 874,130 L1106,130 Q1120,130 1120,144 L1120,180 Z" fill="#2563eb"/>
  <text x="990" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">App</text>
  <text x="990" y="206" text-anchor="middle" font-size="13.5" fill="#475569">Node 24, Next.js 16,</text>
  <text x="990" y="224" text-anchor="middle" font-size="13.5" fill="#475569">React 19, Tailwind 4</text>
  <line x1="880" y1="238" x2="1100" y2="238" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="880" y="264" font-size="13" fill="#1e293b">- Page /: “Hello, author”</text>
  <text x="880" y="284" font-size="13" fill="#1e293b">- GET /api/health</text>
  <text x="880" y="304" font-size="13" fill="#1e293b">- GET /api/legacy/character-state</text>
  <text x="880" y="324" font-size="13" fill="#1e293b">- Checks env vars at startup</text>
  <path d="M860,404 L1120,404 L1120,452 Q1120,466 1106,466 L874,466 Q860,466 860,452 Z" fill="#f1f5f9"/>
  <text x="903.3333333333334" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">DEV</text>
  <text x="903.3333333333334" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Node</text>
  <text x="990" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">PREV</text>
  <text x="990" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Vercel</text>
  <text x="1076.6666666666667" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">PROD</text>
  <text x="1076.6666666666667" y="448" text-anchor="middle" font-size="11" fill="#1e293b">Vercel</text>
  <rect x="872" y="118" width="49" height="24" rx="12" fill="#27272a" stroke="#ffffff" stroke-width="2"/>
  <text x="896.5" y="134.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Core</text>

  <!-- State Database -->
  <rect x="40" y="576" width="260" height="336" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M40,626 L40,590 Q40,576 54,576 L286,576 Q300,576 300,590 L300,626 Z" fill="#d97706"/>
  <text x="170" y="608" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">State Database</text>
  <text x="170" y="652" text-anchor="middle" font-size="13.5" fill="#475569">SQLite (PDO)</text>
  <line x1="60" y1="666" x2="280" y2="666" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="692" font-size="13" fill="#1e293b">- Seeded when a container starts</text>
  <text x="60" y="712" font-size="13" fill="#1e293b">- Table characters</text>
  <text x="60" y="732" font-size="13" fill="#1e293b">- Reads a character by id</text>
  <text x="60" y="752" font-size="13" fill="#1e293b">- Lists a world's characters</text>
  <text x="60" y="772" font-size="13" fill="#1e293b">- Table rate_limit: calls per key</text>
  <path d="M40,850 L300,850 L300,898 Q300,912 286,912 L54,912 Q40,912 40,898 Z" fill="#f1f5f9"/>
  <text x="83.33333333333334" y="870" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">DEV</text>
  <text x="83.33333333333334" y="894" text-anchor="middle" font-size="11" fill="#1e293b">Docker</text>
  <text x="170" y="870" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">PREV</text>
  <text x="170" y="894" text-anchor="middle" font-size="11" fill="#1e293b">Google Cloud</text>
  <text x="256.66666666666663" y="870" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">PROD</text>
  <text x="256.66666666666663" y="894" text-anchor="middle" font-size="11" fill="#1e293b">Google Cloud</text>
  <rect x="52" y="564" width="76" height="24" rx="12" fill="#8a7560" stroke="#ffffff" stroke-width="2"/>
  <text x="90" y="580.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Embedded</text>

  <!-- Connections -->
  <polyline points="300,240 450,240" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="308" y="198" width="134" height="32" rx="7" fill="#ffffff" fill-opacity="0.88" stroke="#cbd5e1"/>
  <text x="375" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">REST API</text>
  <text x="375" y="225" text-anchor="middle" font-size="10.5" fill="#475569">HTTP + JSON, API key</text>

  <polyline points="710,240 860,240" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="736" y="198" width="98" height="32" rx="7" fill="#ffffff" fill-opacity="0.88" stroke="#cbd5e1"/>
  <text x="785" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">In-process</text>
  <text x="785" y="225" text-anchor="middle" font-size="10.5" fill="#475569">function calls</text>

  <polyline points="170,466 170,576" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="179.9" y="505" width="75" height="32" rx="7" fill="#ffffff" fill-opacity="0.88" stroke="#cbd5e1"/>
  <text x="217.4" y="519" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">SQL</text>
  <text x="217.4" y="532" text-anchor="middle" font-size="10.5" fill="#475569">PDO SQLite</text>

  <!-- Legend -->
  <rect x="860" y="1474" width="1080" height="324" rx="14" fill="#ffffff" fill-opacity="0.7" stroke="#cbd5e1"/>
  <text x="888" y="1514" font-size="16" font-weight="700" fill="#0f172a">Legend</text>
  <text x="888" y="1542" font-size="13" font-weight="700" fill="#475569">Location (the badge on each module)</text>
  <rect x="888" y="1560" width="49" height="24" rx="12" fill="#27272a" stroke="#ffffff" stroke-width="2"/>
  <text x="912.5" y="1576.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Core</text>
  <text x="1000" y="1576.5" font-size="13" fill="#1e293b">Runs inside the web app: Node locally, Vercel functions when deployed</text>
  <rect x="888" y="1594" width="62" height="24" rx="12" fill="#52606d" stroke="#ffffff" stroke-width="2"/>
  <text x="919" y="1610.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Docker</text>
  <text x="1000" y="1610.5" font-size="13" fill="#1e293b">A container on the developer's machine; a managed service when deployed</text>
  <rect x="888" y="1628" width="76" height="24" rx="12" fill="#8a7560" stroke="#ffffff" stroke-width="2"/>
  <text x="926" y="1644.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Embedded</text>
  <text x="1000" y="1644.5" font-size="13" fill="#1e293b">Lives inside another module (the SQLite file of the legacy CMS)</text>
  <rect x="888" y="1662" width="76" height="24" rx="12" fill="#ffffff" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="926" y="1678.5" text-anchor="middle" font-size="12" font-weight="700" fill="#27272a">External</text>
  <text x="1000" y="1678.5" font-size="13" fill="#1e293b">A third-party API, called over HTTPS</text>
  <rect x="888" y="1696" width="69" height="24" rx="12" fill="#ffffff" stroke="#27272a" stroke-width="1.5"/>
  <text x="922.5" y="1712.5" text-anchor="middle" font-size="12" font-weight="700" fill="#27272a">Tooling</text>
  <text x="1000" y="1712.5" font-size="13" fill="#1e293b">Runs only on a developer's machine and in CI, never in the product</text>
  <text x="888" y="1750" font-size="13" fill="#1e293b"><tspan font-weight="700">DEV, PREV, PROD:</tspan> what the module runs on in development, Preview and Production.</text>
  <line x1="888" y1="1776" x2="952" y2="1776" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="964" y="1780" font-size="13" fill="#1e293b">Who talks to whom; the label names the protocol and how.</text>
</svg>
