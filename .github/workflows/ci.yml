name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the older, now-useless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Corepack installs the exact pnpm version pinned in package.json ("packageManager").
      - run: corepack enable

      # Node version comes from .nvmrc, the same file used locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail if pnpm-lock.yaml and package.json disagree.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
